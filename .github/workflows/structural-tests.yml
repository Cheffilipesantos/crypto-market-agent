name: Structural Core Tests

on:
  push:
    branches:
      - dev/structural-learning-v1
    paths:
      - structural_core.py
      - market_structure.py
      - shadow_engine.py
      - learning_engine.py
      - agent.py
      - telegram_commands.py
      - test_structural_core.py
      - test_shadow_structural.py
      - test_shadow_positions.py
      - test_shadow_autopsy.py
      - structural_replay.py
      - test_structural_replay.py
      - .github/workflows/structural-tests.yml
  pull_request:
    paths:
      - structural_core.py
      - market_structure.py
      - shadow_engine.py
      - learning_engine.py
      - agent.py
      - telegram_commands.py
      - test_structural_core.py
      - test_shadow_structural.py
      - test_shadow_positions.py
      - test_shadow_autopsy.py
      - structural_replay.py
      - test_structural_replay.py

jobs:
  structural-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile integrated agent
        run: python -m py_compile agent.py market_structure.py structural_core.py shadow_engine.py learning_engine.py telegram_commands.py paper_positions.py leverage_engine.py test_structural_core.py test_shadow_structural.py test_shadow_positions.py test_shadow_autopsy.py structural_replay.py test_structural_replay.py
      - name: Run structural regressions
        run: python test_structural_core.py
      - name: Run Shadow decision regressions
        run: python test_shadow_structural.py
      - name: Run Shadow position regressions
        run: python test_shadow_positions.py
      - name: Run Official Shadow autopsy regressions
        run: python test_shadow_autopsy.py
      - name: Run no-lookahead structural replay regressions
        run: python test_structural_replay.py
